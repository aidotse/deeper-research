<!doctype html>
<!--
  Template for tools/graph.py. The two placeholders below are replaced at build
  time: the vendored libraries, and the survey's graph data as JSON. Edit this
  file to change the viewer; regenerate with `python3 tools/graph.py <topic>`.

  Structure: the graph fills the window, and the controls float over it on
  translucent panels. Three layers are stacked in #stage:
    #underlay  model-space decoration (group boxes, timeline year lines), moved with
               the viewport by one CSS transform;
    #cy        the Cytoscape canvas, which draws nodes and edges but no text;
    #labels    screen-space text, placed every frame with collision culling,
               so that no two labels ever overlap.
  Labels are hierarchical: group names always, paper names only once a paper
  is drawn large enough on screen (highly cited papers first), full titles on
  hover.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survey graph</title>
<style>
  /* Colour roles from the dataviz reference palette. Light and dark are each
     selected steps, not an automatic flip. The eight series hues are the
     reference categorical palette in its validated order; both modes pass the
     validator (2026-10-09). In light mode three hues sit below 3:1 on the
     surface, so groups are always named too: on the map, in the list, in the
     tooltip and in the table. */
  .viz-root {
    color-scheme: light;
    --page: #f4f3ef;
    --surface-1: #fcfcfb;
    --surface-2: #eceae4;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11, 11, 11, 0.09);
    --neutral: #b4b3ad;
    --glass: rgba(252, 252, 251, 0.80);
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 28px rgba(0,0,0,.08);
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --page: #0d0d0d; --surface-1: #1a1a19; --surface-2: #262624;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --grid: #2c2c2a; --baseline: #45443f; --border: rgba(255, 255, 255, 0.09); --neutral: #5d5c57;
      --glass: rgba(26, 26, 25, 0.78); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 32px rgba(0,0,0,.45);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --surface-2: #262624;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --baseline: #45443f; --border: rgba(255, 255, 255, 0.09); --neutral: #5d5c57;
    --glass: rgba(26, 26, 25, 0.78); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 32px rgba(0,0,0,.45);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--page); color: var(--text-primary);
    --gap: 12px; --lw: 300px; --rw: 370px; --tb: 50px; --bb: 92px;
  }
  body.hide-left { --lw: 0px; }
  body.hide-right { --rw: 0px; }
  body.hide-left #left, body.hide-right #right { display: none; }
  button, input, select { font: inherit; color: inherit; }

  /* --- stage ---------------------------------------------------------------------------------- */
  #stage { position: fixed; inset: 0; }
  #underlay { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: opacity .35s; }
  #world.fading { opacity: 0; }
  #cy { position: absolute; inset: 0; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .box {
    position: absolute; border-radius: 28px; background: var(--surface-1);
    border: calc(1px / var(--z, 1)) solid var(--grid);
  }
  .gridline { position: absolute; width: calc(1px / var(--z, 1)); background: var(--grid); }

  .lbl {
    position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0; transition: opacity .18s;
    text-shadow: 0 0 2px var(--page), 0 0 4px var(--page), 0 0 6px var(--page);
    will-change: transform;
  }
  .lbl.on { opacity: 1; }
  .glabel {
    pointer-events: none; background: none; border: 0; padding: 0; cursor: pointer; text-align: center;
    color: var(--text-primary); font-weight: 700; letter-spacing: .01em; line-height: 1.15;
  }
  .glabel.on { pointer-events: auto; }
  .glabel:hover .t { text-decoration: underline; text-underline-offset: 3px; }
  .glabel .sw { display: inline-block; vertical-align: .05em; margin-right: 6px; }
  .glabel .s { display: block; font-weight: 500; font-size: 11px; color: var(--text-secondary); margin-top: 2px; letter-spacing: 0; }
  .plabel { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
  .plabel.sel { color: var(--text-primary); font-weight: 700; font-size: 12px; }
  .lane-label { font-weight: 700; font-size: 12px; color: var(--text-secondary); }
  .lane-label .n { color: var(--text-muted); font-weight: 500; margin-left: 6px; }
  .axis-label { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  /* --- floating panels ------------------------------------------------------------------------ */
  .glass {
    position: fixed; z-index: 5; background: var(--glass); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow);
    backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  }
  #left {
    left: var(--gap); top: var(--gap); bottom: var(--gap); width: var(--lw);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #right {
    right: var(--gap); top: var(--gap); bottom: var(--gap); width: var(--rw);
    overflow: auto; padding: 16px 18px;
  }
  #toolbar {
    top: var(--gap); left: calc(var(--lw) + 2 * var(--gap)); right: calc(var(--rw) + 2 * var(--gap));
    height: var(--tb); display: flex; align-items: center; gap: 8px; padding: 0 10px; overflow: hidden;
  }
  #timebar {
    bottom: var(--gap); left: calc(var(--lw) + 2 * var(--gap)); right: calc(var(--rw) + 2 * var(--gap));
    height: var(--bb); padding: 8px 14px 4px;
  }
  body.hide-left #toolbar, body.hide-left #timebar { left: var(--gap); }
  body.hide-right #toolbar, body.hide-right #timebar { right: var(--gap); }

  /* title card + groups */
  #titlecard { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
  #titlecard h1 { font-size: 16px; line-height: 1.3; margin: 0 0 4px; font-weight: 700; letter-spacing: -.005em; }
  #titlecard p { margin: 0; color: var(--text-secondary); font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(4, auto); gap: 4px 14px; margin-top: 12px; justify-content: start; }
  .stats .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stats .k { font-size: 11px; color: var(--text-muted); }
  .fit { margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
  .fit b { color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .info {
    display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%;
    border: 1px solid var(--baseline); color: var(--text-muted); font-size: 10px; font-weight: 700;
    cursor: help; margin-left: 4px; vertical-align: 1px; background: none; padding: 0;
  }
  #groups-head { padding: 12px 18px 8px; }
  #groups-head label { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  select {
    width: 100%; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 8px; color: var(--text-primary);
  }
  #groups-hint { font-size: 12px; color: var(--text-secondary); margin: 8px 0 0; }
  #groups { overflow: auto; padding: 0 8px 12px; flex: 1; }
  .grp { border-radius: 8px; }
  .grp-row { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 8px; cursor: pointer; }
  .grp-row:hover { background: var(--surface-2); }
  .grp.focus > .grp-row { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--text-primary); }
  .grp-row .caret { width: 14px; flex: none; color: var(--text-muted); font-size: 10px; background: none; border: 0; padding: 0; cursor: pointer; transition: transform .15s; }
  .grp.open .caret { transform: rotate(90deg); }
  .grp-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grp-row .name small { display: block; color: var(--text-muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
  .grp-row .n { color: var(--text-muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .pick { background: none; border: 0; padding: 2px; cursor: pointer; display: grid; place-items: center; border-radius: 50%; }
  .pick:hover { background: var(--surface-1); }
  .members { display: none; padding: 0 0 6px 34px; }
  .grp.open .members { display: block; }
  .members button {
    display: block; width: 100%; text-align: left; background: none; border: 0; padding: 2px 4px;
    color: var(--text-secondary); font-size: 12px; cursor: pointer; border-radius: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .members button:hover { color: var(--text-primary); background: var(--surface-2); }
  .sw { width: 11px; height: 11px; border-radius: 50%; flex: none; display: inline-block; }

  /* toolbar */
  #search-wrap { position: relative; flex: 1; min-width: 150px; max-width: 320px; }
  #search {
    width: 100%; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px 6px 28px; color: var(--text-primary);
  }
  #search-wrap::before { content: "⌕"; position: absolute; left: 9px; top: 4px; color: var(--text-muted); font-size: 15px; }
  #search-count { position: absolute; right: 9px; top: 7px; font-size: 11px; color: var(--text-muted); pointer-events: none; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 2px; flex: none; }
  .seg button { background: none; border: 0; padding: 5px 10px; border-radius: 7px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--surface-1); color: var(--text-primary); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .tb-btn { background: none; border: 0; border-radius: 8px; padding: 5px 9px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; flex: none; }
  .tb-btn:hover { background: var(--surface-2); color: var(--text-primary); }
  .tb-btn[aria-pressed="true"] { color: var(--text-primary); background: var(--surface-2); }
  .spacer { flex: 1; }

  /* timebar */
  #timebar .head { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
  #timebar .head b { color: var(--text-primary); font-weight: 600; }
  #timebar .head button { background: none; border: 0; color: var(--text-secondary); cursor: pointer; padding: 0; font-size: 11px; text-decoration: underline; }
  #hist { width: 100%; height: 62px; display: block; cursor: crosshair; touch-action: none; }
  #hist text { font-size: 10px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }

  /* right panel */
  #right h2 { font-size: 15px; margin: 0 0 6px; line-height: 1.35; }
  #right h2 a { color: inherit; text-decoration: none; }
  #right h2 a:hover { text-decoration: underline; }
  #right .kicker { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; display: flex; justify-content: space-between; }
  #right .kicker button { background: none; border: 0; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 0; line-height: 1; }
  #right .meta { color: var(--text-secondary); font-size: 12px; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 4px; }
  .chip { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text-secondary); }
  #right dl { margin: 0; }
  #right dt { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-top: 12px; }
  #right dd { margin: 3px 0 0; }
  #right p { margin: 6px 0; color: var(--text-secondary); }
  .links button {
    font-size: 12px; text-align: left; display: flex; gap: 6px; align-items: center; width: 100%;
    background: transparent; border: 0; color: var(--text-primary); padding: 3px 4px; cursor: pointer; border-radius: 5px;
  }
  .links button:hover { background: var(--surface-2); }
  .links button span.t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--text-muted); }
  .bars { display: grid; grid-template-columns: minmax(0, 1fr) 90px 34px; gap: 3px 8px; align-items: center; margin-top: 8px; }
  .bars button { background: none; border: 0; padding: 1px 0; text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); font-size: 12px; }
  .bars button:hover { text-decoration: underline; }
  .bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--series-1); border-radius: 4px; }
  .chart { width: 100%; height: auto; display: block; margin: 6px 0 2px; }
  .chart text { font-size: 10px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
  .chart text.lab { fill: var(--text-secondary); font-size: 10.5px; }
  .chart line.grid { stroke: var(--grid); stroke-width: 1; }
  .chart line.tau { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart polyline.null { fill: none; stroke: var(--text-muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .chart line.cursor { stroke: var(--text-primary); stroke-width: 1; opacity: .5; }
  .slider { margin: 8px 0 4px; }
  .slider label { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
  .slider input { width: 100%; margin: 6px 0 2px; accent-color: var(--series-3); }
  .slider .v { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .chart circle.pick { fill: none; stroke: var(--text-primary); stroke-width: 1.5; }
  .bars .pct { font-size: 11px; color: var(--text-muted); text-align: right; font-variant-numeric: tabular-nums; }

  /* table sheet */
  #table-view {
    top: calc(var(--tb) + 2 * var(--gap)); bottom: var(--gap);
    left: calc(var(--lw) + 2 * var(--gap)); right: calc(var(--rw) + 2 * var(--gap)); overflow: auto; z-index: 6;
  }
  body.hide-left #table-view { left: var(--gap); }
  body.hide-right #table-view { right: var(--gap); }
  #table-view table { border-collapse: collapse; width: 100%; font-size: 12px; }
  #table-view th, #table-view td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  #table-view th { position: sticky; top: 0; background: var(--surface-1); color: var(--text-secondary); font-weight: 600; cursor: pointer; white-space: nowrap; }
  #table-view td.num { font-variant-numeric: tabular-nums; text-align: right; }
  #table-view tr:hover td { background: var(--surface-2); }
  #table-view tr { cursor: pointer; }

  #tooltip {
    position: fixed; pointer-events: none; z-index: 20; max-width: 360px; display: none;
    background: var(--glass); color: var(--text-primary); border: 1px solid var(--border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 10px; padding: 8px 11px; font-size: 12px; box-shadow: var(--shadow);
  }
  #tooltip strong { display: block; font-size: 13px; margin-bottom: 3px; line-height: 1.3; }
  #tooltip .sub { color: var(--text-secondary); }
  #errors { position: fixed; bottom: 0; left: 0; z-index: 30; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="viz-root">
<div id="stage">
  <div id="underlay"><div id="world"></div></div>
  <div id="cy" aria-label="Citation graph. The table view lists the same papers."></div>
  <div id="labels"></div>
</div>

<aside class="glass" id="left">
  <div id="titlecard"></div>
  <div id="groups-head">
    <label for="colour">Group and colour by</label>
    <select id="colour"></select>
    <p id="groups-hint"></p>
  </div>
  <div id="groups" role="list"></div>
</aside>

<div class="glass" id="toolbar" role="toolbar" aria-label="Controls">
  <div id="search-wrap"><input type="search" id="search" placeholder="Search papers   /" aria-label="Search"><span id="search-count"></span></div>
  <span class="seg" id="layout" role="group" aria-label="Layout">
    <button data-v="citation" aria-pressed="true" title="Force-directed on citation links only: shows whether groups actually hang together">Citation map</button>
    <button data-v="similarity" aria-pressed="false" hidden title="Force-directed on the clustering's own neighbour graph: papers close together are ones the similarity measure calls similar">Similarity map</button>
    <button data-v="grouped" aria-pressed="false" title="One tile per group, most-cited papers at the centre">Grouped</button>
    <button data-v="timeline" aria-pressed="false" title="Submission month left to right, one row per survey cluster">Timeline</button>
  </span>
  <span class="spacer"></span>
  <button class="tb-btn" id="show-edges" aria-pressed="true" title="Show citation links">Links</button>
  <button class="tb-btn" id="show-pool" aria-pressed="true" hidden title="Show pool papers, not only the coreset">Pool</button>
  <button class="tb-btn" id="fit" title="Fit the graph to the window">Fit</button>
  <button class="tb-btn" id="view-table" aria-pressed="false" title="List the same papers as a sortable table">Table</button>
  <button class="tb-btn" id="panels" aria-pressed="true" title="Show or hide the side panels">Panels</button>
  <button class="tb-btn" id="theme" title="Switch light and dark">◐</button>
</div>

<aside class="glass" id="right" aria-live="polite"></aside>

<div class="glass" id="timebar">
  <div class="head"><span id="range-text"></span><span><button id="range-reset" hidden>Show all dates</button></span></div>
  <svg id="hist" role="img" aria-label="Papers per quarter; drag to filter by date"></svg>
</div>

<section class="glass" id="table-view" hidden></section>
<div id="tooltip" role="tooltip"></div>
<pre id="errors" hidden></pre>

<script>
window.addEventListener("error", e => {
  const el = document.getElementById("errors");
  el.hidden = false;
  el.textContent += "ERROR: " + e.message + " @" + e.lineno + "\n";
});
</script>
<script>/*__VENDOR__*/</script>
<script>
"use strict";
const DATA = /*__DATA__*/null;
cytoscape.use(cytoscapeFcose);

// --- helpers ---------------------------------------------------------------------------------------

const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;        // survey text is untrusted: never innerHTML
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) e.append(kid);
  return e;
};
const svgEl = (tag, attrs = {}) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};
const css = name => getComputedStyle(document.body).getPropertyValue(name).trim();
const hash = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; };
const fmtMonth = m => { const y = Math.floor(m + 1e-6); const mo = Math.round((m - y) * 12) + 1; return `${y}-${String(mo).padStart(2, "0")}`; };
const fmtQuarter = q => `${Math.floor(q + 1e-6)} Q${Math.round((q - Math.floor(q + 1e-6)) * 4) + 1}`;
const short = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const legacy = DATA.layout === "legacy";

const byId = new Map(DATA.nodes.map(n => [n.id, n]));
const clusterById = new Map(DATA.clusters.map(c => [c.id, c]));
const clusterName = id => (clusterById.get(id) || {}).name || id || "unassigned";
// Short names are for the map, where space is scarce: the part before a colon
// or comma, which is usually the theme ("Test-time compute", "Verification").
const shortName = s => short(s.split(/[:,]/)[0].trim(), 30);
const out = new Map(), inc = new Map();
for (const n of DATA.nodes) { out.set(n.id, []); inc.set(n.id, []); }
for (const [a, b] of DATA.edges) { out.get(a).push(b); inc.get(b).push(a); }
const maxIndeg = Math.max(1, ...DATA.nodes.map(n => n.indeg));

// A paper's name on the map: a title's lead phrase when it is short ("Let's
// Verify Step by Step"), else the method's name, else a truncated title.
function paperName(n) {
  const lead = n.title.split(":")[0].trim();
  if (lead.length <= 34) return lead;
  const f = (n.fields.find(([k]) => k === "method name") || [])[1] || "";
  if (f && f.length <= 26 && !/[;]/.test(f) && !/^(n\/a|—|-)$/.test(f)) return f;
  return short(n.title, 30);
}

// --- colour encodings ------------------------------------------------------------------------------
//
// One colour per group, in a fixed order, so that a group keeps its colour
// whatever is filtered (colour follows the entity, never its rank). The eight
// validated hues are never extended with generated ones: past eight groups no
// set of hues keeps every pair apart, least of all for colourblind readers.
// Instead the eight hues repeat with a second channel: groups 1-8 are solid,
// 9-16 hollow rings, 17-24 tinted (a pale fill inside a ring), which covers the
// largest clustering level (22) and a legacy survey's hand-drawn blocks. Beyond
// 24 the tinted style repeats, and only the name tells groups apart. Identity
// never rests on colour alone: every group is also named on the map, in the
// list, in the tooltip and in the table. `n/a` and missing values are neutral
// grey, which is de-emphasis, not a group.

const PALETTE = 8, STYLES = ["solid", "hollow", "tinted"];
function encoding(keys) {
  const m = new Map();
  keys.forEach((k, i) => m.set(k, { slot: (i % PALETTE) + 1,
    style: STYLES[Math.min(Math.floor(i / PALETTE), STYLES.length - 1)] }));
  return m;
}

const MODES = [];
MODES.push({
  id: "cluster", label: "Survey cluster", key: n => n.cluster,
  groups: DATA.clusters.map(c => ({
    key: c.id, label: legacy ? `${c.id}. ${c.name}` : c.name, mapLabel: (legacy ? c.id + " · " : "") + shortName(c.name),
    sub: "", cluster: c,
  })),
});
// A community is named after the survey clusters it is mostly made of: its
// largest cluster, plus the second largest when that is at least half as big.
// The name is derived, not judged, so the composition is shown alongside it.
const commName = new Map();
for (const c of DATA.communities) {
  const [first, second] = c.mix;
  const parts = [first, second && second[1] * 2 >= first[1] ? second : null].filter(Boolean);
  let name = parts.map(([k]) => shortName(clusterName(k))).join(" & ");
  if ([...commName.values()].includes(name)) name += ` (${c.id.slice(1)})`;
  commName.set(c.id, name);
}
const commMix = c => c.mix.slice(0, 3).map(([k, v]) => `${legacy ? k : shortName(clusterName(k))} ${v}`).join(" · ");
MODES.push({
  id: "community", label: "Citation community", key: n => n.community,
  groups: DATA.communities.map(c => ({
    key: c.id, label: commName.get(c.id), mapLabel: commName.get(c.id),
    sub: `${c.size} papers: ${commMix(c)}`, listSub: true, community: c,
  })),
});
// Computed clusters (tools/cluster.py) are named the same way as communities:
// after the survey clusters their papers mostly belong to. For a coreset
// survey the two coincide; for a legacy survey the name shows how the computed
// grouping relates to the hand-drawn blocks.
const CL = DATA.clustering;
function mixOf(ids) {
  const m = new Map();
  for (const id of ids) { const k = byId.get(id).cluster; m.set(k, (m.get(k) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
function nameFromMix(mix, taken, suffix) {
  const [first, second] = mix;
  const parts = [first, second && second[1] * 2 >= first[1] ? second : null].filter(Boolean);
  let name = parts.map(([k]) => shortName(clusterName(k))).join(" & ");
  if (taken.has(name)) name += ` (${suffix})`;
  taken.add(name);
  return name;
}
const fmtStab = s => s == null ? "n/a" : s.toFixed(2);
if (CL) {
  const idsOf = key => f => DATA.nodes.filter(n => n[key] === f).map(n => n.id);
  const taken = new Set(), subTaken = new Set();
  for (const c of CL.clusters) {
    c.mix = mixOf(idsOf("computed")(c.id));
    c.name = nameFromMix(c.mix, taken, c.id);
    for (const s of c.subclusters) { s.mix = mixOf(idsOf("sub")(s.id)); s.name = nameFromMix(s.mix, subTaken, s.id); s.parent = c; }
  }
  MODES.push({
    id: "computed", label: "Computed cluster", key: n => n.computed,
    groups: CL.clusters.map(c => ({
      key: c.id, label: c.name, mapLabel: c.name, listSub: true, computed: c,
      sub: `${c.size} papers · stability ${fmtStab(c.stability)}`,
    })),
  });
  MODES.push({
    id: "sub", label: "Computed sub-cluster", key: n => n.sub,
    groups: CL.clusters.flatMap(c => c.subclusters.map(s => ({
      key: s.id, label: s.name, mapLabel: s.name, listSub: true, subcluster: s,
      sub: `${s.size} papers · stability ${fmtStab(s.stability)} · in ${c.name}`,
    }))),
  });
}
// One mode per computed level, stepped through by the slider in the overview.
// Each level's clusters are named from their survey-cluster mix, like the rest.
if (CL && CL.slider.length) {
  CL.slider.forEach((lv, i) => {
    const counts = new Map();
    for (const n of DATA.nodes) if (n.levels) counts.set(n.levels[i], (counts.get(n.levels[i]) || 0) + 1);
    const keys = [...counts.keys()].sort((a, b) => counts.get(b) - counts.get(a));
    const taken = new Set();
    MODES.push({
      id: `level:${i}`, label: `Level: ${lv.clusters} clusters`, level: i, key: n => n.levels ? n.levels[i] : null,
      groups: keys.map(k => {
        const name = nameFromMix(mixOf(DATA.nodes.filter(n => n.levels && n.levels[i] === k).map(n => n.id)), taken, k);
        return { key: k, label: name, mapLabel: name, listSub: true, sub: `${counts.get(k)} papers` };
      }),
    });
  });
}
const levelIndex = CL && CL.slider.length ? CL.slider.findIndex(l => l.clusters === CL.level) : -1;
const dimNames = [...new Set(DATA.nodes.flatMap(n => Object.keys(n.dims || {})))];
for (const d of dimNames) {
  const counts = new Map();
  for (const n of DATA.nodes) { const v = n.dims[d]; if (v && v !== "n/a") counts.set(v, (counts.get(v) || 0) + 1); }
  const keys = [...counts.keys()].sort((a, b) => counts.get(b) - counts.get(a) || a.localeCompare(b));
  MODES.push({ id: "dim:" + d, label: `Dimension: ${d}`, key: n => n.dims[d],
               groups: keys.map(k => ({ key: k, label: k, mapLabel: k })) });
}
if (DATA.nodes.some(n => n.source)) {
  const keys = ["full-text", "snippet", "abstract"].filter(k => DATA.nodes.some(n => n.source === k));
  MODES.push({ id: "source", label: "Verification source", key: n => n.source,
               groups: keys.map(k => ({ key: k, label: k, mapLabel: k })) });
}
for (const m of MODES) {
  m.enc = encoding(m.groups.map(g => g.key));
  m.byKey = new Map(m.groups.map(g => [g.key, g]));
  const noneLabel = { community: "No citation links", cluster: "Unassigned", computed: "Not clustered",
                      sub: "In no sub-cluster" }[m.id] || "n/a";
  if (DATA.nodes.some(n => keyOf(n, m) == null)) {
    const g = { key: null, label: noneLabel, mapLabel: noneLabel, none: true };
    m.groups.push(g); m.byKey.set(null, g);
  }
  // Cohesion: of the citation links touching a group, the share that stay
  // inside it. A group whose papers mostly cite other groups is a label, not
  // a neighbourhood.
  for (const g of m.groups) { g.inner = 0; g.touching = 0; g.members = []; }
  for (const n of DATA.nodes) m.byKey.get(keyOf(n, m)).members.push(n.id);
  for (const [a, b] of DATA.edges) {
    const ka = keyOf(byId.get(a), m), kb = keyOf(byId.get(b), m);
    m.byKey.get(ka).touching++;
    if (ka === kb) m.byKey.get(ka).inner++; else m.byKey.get(kb).touching++;
  }
  for (const g of m.groups) {
    g.cohesion = g.touching ? g.inner / g.touching : null;
    g.members.sort((a, b) => byId.get(b).indeg - byId.get(a).indeg || a.localeCompare(b));
  }
}
function keyOf(n, m = state.mode) { const v = m.key(n); return v == null || v === "" || v === "n/a" ? null : v; }

function encOf(key) {
  if (key == null) return undefined;
  if (state.mode.enc) return state.mode.enc.get(key);
  return state.picked.has(key) ? { slot: state.picked.get(key), style: "solid" } : undefined;
}

const SHAPES = { anchor: "diamond", frontier: "triangle", dissent: "vee", bridge: "hexagon" };
const hasRoles = DATA.nodes.some(n => n.role);

// --- state -----------------------------------------------------------------------------------------

const months = DATA.nodes.map(n => n.month);
const tMin = Math.floor(Math.min(...months) * 4) / 4, tMax = Math.floor(Math.max(...months) * 4) / 4 + 0.25;
const state = {
  // Default to the survey's clusters when colour can show them all, otherwise
  // to citation communities, which usually number few enough to show at once.
  mode: MODES[0].enc ? MODES[0] : MODES[1], picked: new Map(), layout: "citation", view: "graph",
  focus: undefined, selected: null, hover: null, search: "", from: tMin, to: tMax,
  showPool: true, showEdges: true, open: new Set(),
};
const isFocused = () => state.focus !== undefined;

function visibleNode(n) {
  if (!state.showPool && !n.coreset) return false;
  return n.month >= state.from - 1e-6 && n.month < state.to - 1e-6;
}
function matches(n) {
  if (!state.search) return true;
  const q = state.search.toLowerCase();
  return n.title.toLowerCase().includes(q) || n.id.includes(q);
}

// --- graph -----------------------------------------------------------------------------------------

const size = n => (n.coreset ? 1 : 0.7) * (9 + 30 * Math.sqrt(n.indeg / maxIndeg));

const cy = cytoscape({
  container: $("cy"),
  elements: [
    ...DATA.nodes.map(n => ({
      group: "nodes",
      data: { id: n.id, size: size(n), shape: SHAPES[n.role] || "ellipse", pool: n.coreset ? 0 : 1 },
      position: { x: hash(n.id + "x") * 1000, y: hash(n.id + "y") * 700 },
    })),
    ...DATA.edges.map(([a, b]) => ({ group: "edges", data: { id: a + ">" + b, source: a, target: b } })),
  ],
  minZoom: 0.08, maxZoom: 5, wheelSensitivity: 0.3, boxSelectionEnabled: false,
});

function paint() {
  const neutral = css("--neutral"), surface = css("--surface-1"), page = css("--page"), muted = css("--text-muted");
  cy.batch(() => {
    cy.nodes().forEach(node => {
      const e = encOf(keyOf(byId.get(node.id())));
      const hue = e ? css(`--series-${e.slot}`) : neutral;
      const style = e ? e.style : "solid";
      node.data({
        fill: style === "hollow" ? surface : hue,
        fillOpacity: style === "tinted" ? 0.35 : 1,
        ring: style === "solid" ? page : hue,
        ringWidth: style === "solid" ? 1.5 : 2.5,
      });
    });
    // A link inside one coloured group takes the group's hue, so cohesion is
    // visible at a glance; links across groups stay neutral.
    cy.edges().forEach(edge => {
      const ka = keyOf(byId.get(edge.source().id())), kb = keyOf(byId.get(edge.target().id()));
      const e = ka === kb ? encOf(ka) : undefined;
      edge.data({ col: e ? css(`--series-${e.slot}`) : muted, within: e ? 1 : 0 });
    });
  });
  cy.style(styleSheet());
  applyFocus();
}

function styleSheet() {
  const primary = css("--text-primary"), secondary = css("--text-secondary");
  return [
    { selector: "node", style: {
      width: "data(size)", height: "data(size)", shape: "data(shape)",
      "background-color": "data(fill)", "background-opacity": "data(fillOpacity)",
      "border-color": "data(ring)", "border-width": "data(ringWidth)",
      "transition-property": "opacity", "transition-duration": "0.18s",
    }},
    { selector: "node[pool = 1]", style: { opacity: 0.55 } },
    { selector: "edge", style: {
      width: 0.8, "line-color": "data(col)", opacity: 0.16, "curve-style": "haystack", "haystack-radius": 0,
      "transition-property": "opacity", "transition-duration": "0.18s",
    }},
    { selector: "edge[within = 1]", style: { opacity: 0.32 } },
    { selector: "node.faded", style: { opacity: 0.28 } },
    { selector: "node.dim", style: { opacity: 0.07 } },
    { selector: "edge.cross", style: { opacity: 0.035 } },
    { selector: "edge.dim", style: { opacity: 0.02 } },
    { selector: "edge.hi", style: {
      opacity: 0.9, width: 1.4, "line-color": secondary, "curve-style": "straight",
      "target-arrow-shape": "triangle", "target-arrow-color": secondary, "arrow-scale": 0.7, "z-index": 5,
    }},
    { selector: "node.hi", style: { opacity: 1 } },
    { selector: "node.hover", style: { "border-color": primary, "border-width": 2.5, opacity: 1, "z-index": 9 } },
    { selector: "node:selected", style: { "border-color": primary, "border-width": 3.5, opacity: 1, "z-index": 10 } },
  ];
}

function applyFilters() {
  cy.batch(() => {
    cy.nodes().forEach(node => node.style("display", visibleNode(byId.get(node.id())) ? "element" : "none"));
    cy.edges().style("display", state.showEdges ? "element" : "none");
  });
  applyFocus();
  updateStats(); renderGroups(); renderHist(); renderTable();
  labelsDirty = true; scheduleLabels();
}

// Emphasis, from weakest to strongest: compare mode fades unpicked groups; a
// focused group or a search dims everything else; the hovered or selected
// paper lifts itself, its links and its neighbours back to full strength.
function applyFocus() {
  let hits = 0;
  cy.batch(() => {
    cy.elements().removeClass("dim hi faded cross");
    const compare = !state.mode.enc && state.picked.size;
    cy.nodes().forEach(node => {
      const n = byId.get(node.id());
      const k = keyOf(n);
      const m = matches(n);
      if (state.search && m && visibleNode(n)) hits++;
      if ((isFocused() && k !== state.focus) || !m) node.addClass("dim");
      else if (compare && !state.picked.has(k)) node.addClass("faded");
    });
    // On the grouped layout, links between tiles are faint until a paper is
    // hovered or selected: drawn at full strength they cover the tiles.
    if (state.layout === "grouped") cy.edges().forEach(e => { if (keyOf(byId.get(e.source().id())) !== keyOf(byId.get(e.target().id()))) e.addClass("cross"); });
    cy.edges().forEach(e => { if (e.source().hasClass("dim") || e.target().hasClass("dim") || e.source().hasClass("faded") || e.target().hasClass("faded")) e.addClass("dim"); });
    for (const id of [state.selected, state.hover]) {
      if (!id) continue;
      const node = cy.getElementById(id);
      node.connectedEdges().removeClass("dim").addClass("hi");
      node.closedNeighborhood("node").removeClass("dim faded").addClass("hi");
    }
  });
  $("search-count").textContent = state.search ? `${hits} found` : "";
  scheduleLabels();
}

// --- layouts ---------------------------------------------------------------------------------------
//
// Each layout returns target positions plus any model-space decoration. Moving
// between layouts animates, so a reader can follow a paper from one to another.

let citationPos = null;
function citationLayout() {
  if (!citationPos) {
    const saved = new Map(cy.nodes().map(n => [n.id(), { ...n.position() }]));
    // Links inside a citation community are given a shorter ideal length than
    // links across communities, which pulls each community into its own region
    // of the map. Communities come from the same links, so this separates what
    // the links already say rather than imposing the survey's clusters.
    const same = e => byId.get(e.source().id()).community != null && byId.get(e.source().id()).community === byId.get(e.target().id()).community;
    cy.layout({ name: "fcose", randomize: false, animate: false, quality: "proof", packComponents: true,
                nodeRepulsion: 16000, idealEdgeLength: e => same(e) ? 70 : 190, edgeElasticity: e => same(e) ? 0.45 : 0.08,
                gravity: 0.5, gravityRange: 2.5, nodeSeparation: 60, numIter: 4000 }).run();
    citationPos = new Map(cy.nodes().map(n => [n.id(), { ...n.position() }]));
    cy.nodes().forEach(n => n.position(saved.get(n.id())));
  }
  return { pos: citationPos, boxes: [], lanes: [], years: [] };
}

// Laid out on the neighbour graph tools/cluster.py clustered, not on citations,
// so that distance on screen follows the similarity measure. It runs in a
// headless instance so the citation map's positions are untouched.
let similarityPos = null;
function similarityLayout() {
  if (!similarityPos) {
    const h = cytoscape({ headless: true, styleEnabled: true,
      style: [{ selector: "node", style: { width: 14, height: 14 } }],
      elements: [...DATA.nodes.map(n => ({ data: { id: n.id } })),
                 ...CL.knn.filter(([a, b]) => byId.has(a) && byId.has(b)).map(([a, b, w], i) => ({ data: { id: "k" + i, source: a, target: b, w } }))] });
    // Seed the layout's randomness, so the map looks the same on every load and a
    // shape seen once can be found again.
    const random = Math.random;
    let seed = 20260929;
    Math.random = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
    try {
      h.layout({ name: "fcose", animate: false, quality: "proof", randomize: true, packComponents: true,
                 nodeRepulsion: 9000, idealEdgeLength: e => 30 + 150 * (1 - e.data("w")), edgeElasticity: e => 0.1 + 0.4 * e.data("w"),
                 gravity: 0.35, gravityRange: 3, nodeSeparation: 40, numIter: 4000 }).run();
    } finally { Math.random = random; }
    similarityPos = new Map(h.nodes().map(n => [n.id(), { ...n.position() }]));
    h.destroy();
  }
  return { pos: similarityPos, boxes: [], lanes: [], years: [] };
}

function orderedGroups() { return state.mode.groups.filter(g => g.members.some(id => visibleNode(byId.get(id)))); }

function groupedLayout() {
  // A deterministic tile per group, not a force layout. Groups that share many
  // links would otherwise be dragged into one another until the tiles overlap;
  // the citation map is where that pull is shown.
  const pos = new Map(), boxes = [];
  const groups = state.mode.groups.filter(g => g.members.length);
  const spacing = 26, biggest = Math.max(...groups.map(g => g.members.length));
  const tile = 2 * spacing * Math.sqrt(biggest) + 150;
  const cols = Math.ceil(Math.sqrt(groups.length * 1.7));
  groups.forEach((g, gi) => {
    const cx = (gi % cols) * tile, cyy = Math.floor(gi / cols) * tile;
    // Sunflower spiral, most-cited first, so each group's hubs sit at its centre.
    let r = 0;
    g.members.forEach((id, i) => {
      r = spacing * Math.sqrt(i + 0.5); const t = i * 2.39996;
      pos.set(id, { x: cx + r * Math.cos(t), y: cyy + r * Math.sin(t) });
    });
    const half = r + 34;
    boxes.push({ key: g.key, x: cx - half, y: cyy - half, w: 2 * half, h: 2 * half });
  });
  return { pos, boxes, lanes: [], years: [] };
}

function timelineLayout() {
  // Submission month left to right, one row per survey cluster top to bottom.
  // Rows sit close and papers scatter around them, so the picture reads as one
  // continuous field of work drifting across topics over time, not as
  // separate lanes. Colour is independent of the rows, so colouring by
  // citation community shows how communities cut across the survey's clusters.
  const perYear = 260, x0 = tMin;
  const rows = DATA.clusters.map(c => c.id);
  // Row spacing follows the window's shape, so the plot fills the height too.
  // The scatter scales with it, so rows still blend into one another.
  const ins = insets(), labelRoom = 260;
  const aspect = Math.max(1, innerHeight - ins.t - ins.b) / Math.max(1, innerWidth - ins.l - ins.r - labelRoom);
  const rowH = clamp(aspect * (tMax - x0) * perYear / rows.length, 56, 150);
  const pos = new Map();
  for (const n of DATA.nodes) {
    const row = Math.max(0, rows.indexOf(n.cluster));
    pos.set(n.id, { x: (n.month - x0) * perYear + (hash(n.id) - 0.5) * 18,
                    y: row * rowH + (hash(n.id + "j") - 0.5) * rowH * 0.7 });
  }
  const lanes = rows.map((id, k) => ({ key: id, y: k * rowH, n: DATA.nodes.filter(n => n.cluster === id).length }));
  const top = -rowH, bottom = rows.length * rowH - rowH / 2, years = [];
  for (let yr = Math.ceil(x0); yr <= tMax; yr++) years.push({ x: (yr - x0) * perYear, label: String(yr), top, bottom });
  return { pos, boxes: [], lanes, years };
}

let current = { pos: new Map(), boxes: [], lanes: [], years: [] };
let fitZoom = 1;   // the zoom of the last whole-graph fit: the overview

function runLayout(animate = true) {
  cy.autoungrabify(state.layout !== "citation");
  phys.running = false; phys.grabbed = null; phys.vel.clear();
  const next = state.layout === "grouped" ? groupedLayout() : state.layout === "timeline" ? timelineLayout()
    : state.layout === "similarity" ? similarityLayout() : citationLayout();
  current = next;
  $("world").classList.add("fading");
  const done = () => { drawWorld(); $("world").classList.remove("fading"); labelsDirty = true; scheduleLabels(); };
  fitTo(next.pos, animate);
  if (!animate) {
    cy.batch(() => cy.nodes().forEach(n => n.position(next.pos.get(n.id()))));
    done(); return;
  }
  const anims = cy.nodes().map(n => n.animation({ position: next.pos.get(n.id()), duration: 700, easing: "ease-in-out-cubic" }).play().promise());
  Promise.all(anims).then(done);
}

// The panels float over the graph, so "fit" means fit to the space between them.
function insets() {
  const g = 12, b = document.body.classList, W = innerWidth, H = innerHeight;
  const left = b.contains("hide-left") ? g : $("left").getBoundingClientRect().right + g;
  const right = b.contains("hide-right") ? g : W - $("right").getBoundingClientRect().left + g;
  return { l: left + 16, r: right + 16, t: $("toolbar").getBoundingClientRect().bottom + 24,
           b: H - $("timebar").getBoundingClientRect().top + 24 };
}
function fitTo(pos, animate, ids) {
  const pts = [];
  for (const [id, p] of pos) if ((!ids || ids.has(id)) && visibleNode(byId.get(id))) pts.push([p, byId.get(id)]);
  if (!pts.length) return;
  const r = s => size(s) / 2;
  if (!ids && pts.length > 40 && (state.layout === "citation" || state.layout === "similarity")) {
    const q = (arr, f) => arr[Math.floor(f * (arr.length - 1))];
    const xs = pts.map(([p]) => p.x).sort((a, b) => a - b), ys = pts.map(([p]) => p.y).sort((a, b) => a - b);
    const lo = [q(xs, 0.008), q(ys, 0.008)], hi = [q(xs, 0.992), q(ys, 0.992)];
    const keep = pts.filter(([p]) => p.x >= lo[0] && p.x <= hi[0] && p.y >= lo[1] && p.y <= hi[1]);
    pts.length = 0; pts.push(...keep);
  }
  const x1 = Math.min(...pts.map(([p, n]) => p.x - r(n))), x2 = Math.max(...pts.map(([p, n]) => p.x + r(n)));
  const y1 = Math.min(...pts.map(([p, n]) => p.y - r(n))), y2 = Math.max(...pts.map(([p, n]) => p.y + r(n)));
  const i = insets();
  if (state.layout === "grouped") i.t += 28;
  // Leave room left of the plot for the timeline's row names.
  if (state.layout === "timeline") i.l += Math.max(...DATA.clusters.map(c =>
    textWidth((legacy ? c.id + " · " : "") + shortName(c.name), 12, 700) + 40)) + 24;
  const W = Math.max(200, innerWidth - i.l - i.r), H = Math.max(160, innerHeight - i.t - i.b);
  const zoom = clamp(Math.min(W / Math.max(1, x2 - x1), H / Math.max(1, y2 - y1)), cy.minZoom(), ids ? 2.2 : cy.maxZoom());
  const pan = { x: i.l + W / 2 - zoom * (x1 + x2) / 2, y: i.t + H / 2 - zoom * (y1 + y2) / 2 };
  if (!ids) fitZoom = zoom;
  if (animate) cy.animate({ zoom, pan }, { duration: 700, easing: "ease-in-out-cubic" });
  else cy.viewport({ zoom, pan });
}

const measure = document.createElement("canvas").getContext("2d");

// Where to name a group on the citation map: the centre of its densest patch,
// not its centroid, because a loosely knit group's centroid can fall in empty
// space or on top of another group.
function groupAnchors() {
  const res = new Map(), R = 140;
  for (const g of state.mode.groups) {
    const pts = g.members.filter(id => visibleNode(byId.get(id))).map(id => cy.getElementById(id).position());
    if (pts.length < 3) continue;
    let best = null, bestN = -1;
    for (const p of pts) {
      const n = pts.filter(q => (q.x - p.x) ** 2 + (q.y - p.y) ** 2 < R * R).length;
      if (n > bestN) { bestN = n; best = p; }
    }
    const near = pts.filter(q => (q.x - best.x) ** 2 + (q.y - best.y) ** 2 < R * R);
    res.set(g.key, { x: near.reduce((s, q) => s + q.x, 0) / near.length, y: near.reduce((s, q) => s + q.y, 0) / near.length, n: pts.length });
  }
  return res;
}

function labelSpecs() {
  const specs = [], z = cy.zoom(), p = cy.pan(), i = insets();

  const layout = state.layout;

  if (layout === "timeline") {
    // Row names sit left of the plot, pinned to the panel edge when panning
    // would push them off screen. Year labels stick to the top edge.
    const x0 = -24 * z + p.x;
    for (const l of current.lanes) {
      const y = l.y * z + p.y;
      if (y < i.t - 20 || y > innerHeight - i.b + 20) continue;
      const c = clusterById.get(l.key);
      const text = (legacy ? l.key + " · " : "") + shortName(c ? c.name : l.key);
      const w = textWidth(text, 12, 700) + textWidth(String(l.n), 11, 500) + 8;
      specs.push({ key: "lane:" + l.key, kind: "lane", text, n: l.n, x: Math.max(i.l - 8, x0 - w), y, align: "left", valign: "middle", prio: 1e9 });
    }
    for (const yv of current.years) {
      const x = yv.x * z + p.x;
      specs.push({ key: "year:" + yv.label, kind: "axis", text: yv.label, x: x + 4, y: Math.max(i.t - 18, yv.top * z + p.y - 18), align: "left", prio: 1e9 });
    }
  }
  if (layout !== "timeline") {
    const compare = !state.mode.enc;
    if (labelsDirty && (layout === "citation" || layout === "similarity")) anchors = groupAnchors();
    for (const g of state.mode.groups) {
      if (g.none && layout !== "grouped") continue;
      // On the citation map, name only the groups the colours currently show;
      // naming seventeen scattered clusters at once would be noise.
      if (layout !== "grouped" && compare && !state.picked.has(g.key) && state.focus !== g.key) continue;
      if (isFocused() && state.focus !== g.key) continue;
      let at, n;
      if (layout === "grouped") {

        at = toScreen({ x: b.x + b.w / 2, y: b.y }); at.y -= 6; n = g.members.length;

        // truncate it to fit, so that zooming out shortens names before hiding them.
        const room = Math.max(70, b.w * z * 1.25);

        if (text.endsWith("…") && text.length <= 5) continue;

      } else {

        specs.push({ key: "g:" + g.key, kind: "group", g, text: g.mapLabel, sub: g.sub, x: at.x, y: at.y, align: "center", valign: "middle", px, prio: 1e6 + n });

  // a paper is named when it is drawn at least 14px across, so the most cited
  // papers are named first. The selected paper is always named.
  const W = innerWidth, H = innerHeight, zoomedIn = z > fitZoom * 1.3;

  });

}

function drawLabels() {
  if (state.view !== "graph") return;
  const specs = labelSpecs().sort((a, b) => b.prio - a.prio);
  const placed = [], shown = new Set(), layer = $("labels");
  const budget = { paper: 70 };
  for (const s of specs) {
    let w, h;
    if (s.kind === "group") { w = Math.max(textWidth(s.text, s.px, 700) + 18, s.sub ? textWidth(s.sub, 11, 500) : 0); h = s.px * 1.2 + (s.sub ? 15 : 0); }
    else if (s.kind === "lane") { w = textWidth(s.text, 12, 700) + textWidth(String(s.n), 11, 500) + 8; h = 16; }
    else if (s.kind === "axis") { w = textWidth(s.text, 11, 400); h = 14; }
    else { if (!s.sel && budget.paper-- <= 0) continue; w = textWidth(s.text, s.sel ? 12 : 11, s.sel ? 700 : 500); h = 15; }
    const x = s.align === "center" ? s.x - w / 2 : s.x;
    const y = s.valign === "middle" ? s.y - h / 2 : s.valign === "bottom" ? s.y - h : s.y;
    const r = { x1: x - 3, y1: y - 1, x2: x + w + 3, y2: y + h + 1 };
    const fixed = s.kind === "axis" || s.kind === "lane";
    if (!fixed && placed.some(q => r.x1 < q.x2 && r.x2 > q.x1 && r.y1 < q.y2 && r.y2 > q.y1)) continue;
    placed.push(r);
    let e = labelEls.get(s.key);
    if (!e) { e = makeLabel(s); labelEls.set(s.key, e); layer.append(e); }
    if (s.kind === "group") { e.style.fontSize = s.px + "px"; e.querySelector(".t").textContent = s.text; }
    if (s.kind === "paper") { e.textContent = s.text; e.classList.toggle("sel", !!s.sel); }
    e.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
    shown.add(s.key);
  }
  for (const [k, e] of labelEls) {
    const on = shown.has(k);
    e.classList.toggle("on", on);
    if (!on && !k.startsWith("g:") && !k.startsWith("lane:")) { e.remove(); labelEls.delete(k); }
  }
}

function makeLabel(s) {
  if (s.kind === "group") {
    const e = el("button", { class: "lbl glabel", title: `${s.g.label}: click to focus`, onclick: () => focusGroup(s.g.key, true) },
      swatch(encOf(s.g.key)), el("span", { class: "t", text: s.text }));
    if (s.sub) e.append(el("span", { class: "s", text: s.sub }));

  }

  if (s.kind === "axis") return el("div", { class: "lbl axis-label", text: s.text });

cy.on("viewport", scheduleLabels);

// --- elastic dragging (citation map only) ----------------------------------------------------------
//
// Drag a paper and its citation links behave like elastic bands: neighbours
// are pulled along, their neighbours a little less, and on release everything
// springs back to the laid-out position. Each paper is tied to its rest
// position by a weak spring, and each link resists being stretched away from
// its rest length and direction. Only the citation map is elastic; the grouped
// tiles and the timeline's rows are rigid by design.

const nbrOf = new Map(DATA.nodes.map(n => [n.id, []]));
for (const [a, b] of DATA.edges) { nbrOf.get(a).push(b); nbrOf.get(b).push(a); }
const phys = { vel: new Map(), running: false, grabbed: null };
const ANCHOR = 0.09, ELASTIC = 0.10, DAMPING = 0.8;

function physicsStart() {
  if (phys.running || state.layout !== "citation" || !citationPos) return;
  phys.running = true;
  requestAnimationFrame(physicsStep);
}
function physicsStep() {
  if (state.layout !== "citation") { phys.running = false; phys.vel.clear(); return; }
  const cur = new Map(); cy.nodes().forEach(n => cur.set(n.id(), n.position()));
  const next = [];
  let moving = false;
  for (const [id, p] of cur) {
    if (id === phys.grabbed) continue;
    const r = citationPos.get(id);
    let fx = ANCHOR * (r.x - p.x), fy = ANCHOR * (r.y - p.y);
    const nb = nbrOf.get(id);
    if (nb.length) {
      // Normalised by sqrt(degree), so hubs move, but less than leaves do.
      let ex = 0, ey = 0;
      for (const j of nb) { const pj = cur.get(j), rj = citationPos.get(j); ex += (pj.x - p.x) - (rj.x - r.x); ey += (pj.y - p.y) - (rj.y - r.y); }
      const k = ELASTIC / Math.sqrt(nb.length);
      fx += k * ex; fy += k * ey;
    }
    const v = phys.vel.get(id) || { x: 0, y: 0 };
    v.x = (v.x + fx) * DAMPING; v.y = (v.y + fy) * DAMPING;
    phys.vel.set(id, v);
    if (Math.abs(v.x) + Math.abs(v.y) > 0.02 || Math.abs(r.x - p.x) + Math.abs(r.y - p.y) > 0.3) moving = true;
    next.push([id, p.x + v.x, p.y + v.y]);
  }
  if (moving || phys.grabbed) {
    cy.batch(() => { for (const [id, x, y] of next) cy.getElementById(id).position({ x, y }); });
    requestAnimationFrame(physicsStep);
  } else {
    // At rest: snap the last fraction of a pixel exactly home.
    cy.batch(() => cy.nodes().forEach(n => n.position(citationPos.get(n.id()))));
    phys.running = false; phys.vel.clear();
  }
}
cy.on("grab", "node", ev => { if (state.layout !== "citation") return; phys.grabbed = ev.target.id(); tip.style.display = "none"; physicsStart(); });
cy.on("free", "node", () => { phys.grabbed = null; physicsStart(); });

function select(id, zoom = false) {

  else { s.style.background = `color-mix(in srgb, ${hue} 35%, var(--surface-1))`; s.style.border = `2px solid ${hue}`; }
  return s;
}

$("hist").addEventListener("pointerup", () => {
  if (!brush) return;
  state.from = Math.min(brush.a, brush.b); state.to = Math.max(brush.a, brush.b) + 0.25; brush = null;
  applyFilters(); syncHash();
});
$("hist").addEventListener("dblclick", () => resetRange());
$("range-reset").addEventListener("click", () => resetRange());
function resetRange() { state.from = tMin; state.to = tMax; applyFilters(); syncHash(); }

// --- table -----------------------------------------------------------------------------------------

const COLS = [
  ["Paper", n => n.title], ["Submitted", n => n.month, fmtMonth], ["Cluster", n => clusterName(n.cluster)],
  ["Community", n => n.community ? commName.get(n.community) : null], ["Role", n => n.role || (n.coreset ? "" : "pool")],
  ["Cited here", n => n.indeg, null, true], ["Citations", n => n.citations, v => v == null ? "–" : v.toLocaleString(), true],
  ["Source", n => n.source || ""],
];
let sortCol = 5, sortDir = -1;
function renderTable() {
  if (state.view !== "table") return;
  const rows = DATA.nodes.filter(n => visibleNode(n) && matches(n)).sort((a, b) => {
    const va = COLS[sortCol][1](a), vb = COLS[sortCol][1](b);
    if (va == null) return 1; if (vb == null) return -1;
    return (va > vb ? 1 : va < vb ? -1 : 0) * sortDir;
  });
  const head = el("tr", {}, ...COLS.map(([name], i) => el("th", {
    scope: "col", "aria-sort": i === sortCol ? (sortDir > 0 ? "ascending" : "descending") : "none",
    onclick: () => { sortDir = i === sortCol ? -sortDir : (COLS[i][3] ? -1 : 1); sortCol = i; renderTable(); },
    text: name + (i === sortCol ? (sortDir > 0 ? " ↑" : " ↓") : ""),
  })));
  const body = rows.map(n => el("tr", { tabindex: "0",
    onclick: () => { setView("graph"); select(n.id, true); },
    onkeydown: e => { if (e.key === "Enter") { setView("graph"); select(n.id, true); } } },
    ...COLS.map(([, get, fmt, num]) => { const v = get(n); return el("td", { class: num ? "num" : "", text: fmt ? fmt(v) : (v == null ? "–" : String(v)) }); })));
  $("table-view").replaceChildren(el("table", {}, el("thead", {}, head), el("tbody", {}, ...body)));
}

// --- controls --------------------------------------------------------------------------------------

function setPressed(group, v) { for (const b of $(group).querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.v === v)); }
function setView(v) {
  state.view = v;
  $("view-table").setAttribute("aria-pressed", String(v === "table"));
  $("table-view").hidden = v !== "table"; $("labels").hidden = v === "table";
  if (v === "table") renderTable(); else scheduleLabels();
  syncHash();
}

const levelGroup = el("optgroup", { label: "Computed, by level" });
for (const m of MODES) (m.level != null ? levelGroup : $("colour")).append(el("option", { value: m.id, text: m.label }));
if (levelGroup.children.length) $("colour").append(levelGroup);
function setMode(id, panel = true) {
  state.mode = MODES.find(m => m.id === id); state.focus = undefined; state.picked.clear(); state.open.clear();
  $("colour").value = id;
  paint(); resetLabels(); renderGroups(); if (panel) renderPanel(); syncHash();
  if (state.layout === "grouped") runLayout();
}
$("colour").addEventListener("change", e => setMode(e.target.value));
$("layout").addEventListener("click", e => {
  const v = e.target.dataset && e.target.dataset.v; if (!v || v === state.layout) return;
  state.layout = v; setPressed("layout", v); resetLabels(); runLayout(); syncHash();
});
$("search").addEventListener("input", e => { state.search = e.target.value.trim(); applyFocus(); renderTable(); });
$("search").addEventListener("keydown", e => {
  if (e.key !== "Enter" || !state.search) return;
  const hits = new Set(DATA.nodes.filter(n => visibleNode(n) && matches(n)).map(n => n.id));
  if (hits.size === 1) select([...hits][0], true); else if (hits.size) fitTo(current.pos, true, hits);
});
const toggle = (id, key) => $(id).addEventListener("click", () => {
  state[key] = !state[key]; $(id).setAttribute("aria-pressed", String(state[key])); applyFilters();
});
toggle("show-edges", "showEdges"); toggle("show-pool", "showPool");
$("fit").addEventListener("click", () => fitTo(current.pos, true));
$("view-table").addEventListener("click", () => setView(state.view === "table" ? "graph" : "table"));
$("panels").addEventListener("click", () => {
  const hidden = document.body.classList.contains("hide-left");
  document.body.classList.toggle("hide-left", !hidden); document.body.classList.toggle("hide-right", !hidden);
  $("panels").setAttribute("aria-pressed", String(hidden));
  renderHist(); fitTo(current.pos, true);
});
$("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  paint(); renderHist(); resetLabels(); syncHash();
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("search")) { e.preventDefault(); $("search").focus(); }
  if (e.key === "Escape") {
    if (document.activeElement === $("search") && state.search) { $("search").value = ""; state.search = ""; applyFocus(); renderTable(); }
    else if (state.view === "table") setView("graph");
    else if (state.selected) select(null);
    else if (isFocused()) focusGroup(undefined, true);
  }
});
let resizeTimer = 0;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { renderHist(); scheduleLabels(); }, 100); });

// A view can be stated in the URL hash, e.g. #layout=timeline&colour=community&theme=light,
// so that it can be bookmarked or shared. The hash follows the view as it changes.
let hashReady = false;
function syncHash() {
  if (!hashReady) return;
  const h = new URLSearchParams();
  if (document.documentElement.dataset.theme) h.set("theme", document.documentElement.dataset.theme);
  if (state.mode !== defaultMode) h.set("colour", state.mode.id);
  if (state.layout !== "citation") h.set("layout", state.layout);
  if (state.picked.size) h.set("pick", [...state.picked.keys()].join(","));
  if (isFocused() && state.focus !== null) h.set("focus", state.focus);
  if (state.selected) h.set("select", state.selected);
  if (state.from > tMin + 1e-6) h.set("from", state.from);
  if (state.to < tMax - 1e-6) h.set("to", state.to);
  if (state.view === "table") h.set("view", "table");
  history.replaceState(null, "", h.toString() ? "#" + h.toString() : location.pathname + location.search);
}

// --- init ------------------------------------------------------------------------------------------

const defaultMode = state.mode;
document.title = `${DATA.title} — graph`;
const params = new URLSearchParams(location.hash.slice(1));
if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");
if (MODES.some(m => m.id === params.get("colour"))) state.mode = MODES.find(m => m.id === params.get("colour"));
$("colour").value = state.mode.id;
if (CL && CL.knn) document.querySelector('#layout [data-v="similarity"]').hidden = false;
if (["citation", "grouped", "timeline"].concat(CL && CL.knn ? ["similarity"] : []).includes(params.get("layout"))) { state.layout = params.get("layout"); setPressed("layout", state.layout); }
if (params.get("pick") && !state.mode.enc) params.get("pick").split(",").filter(k => state.mode.byKey.has(k)).slice(0, 3).forEach((k, i) => state.picked.set(k, i + 1));
if (params.get("from")) state.from = clamp(Number(params.get("from")), tMin, tMax - 0.25);
if (params.get("to")) state.to = clamp(Number(params.get("to")), state.from + 0.25, tMax);
$("show-pool").hidden = DATA.nodes.every(n => n.coreset);

renderTitle();
paint();
applyFilters();
runLayout(false);
if (params.get("focus") && state.mode.byKey.has(params.get("focus"))) focusGroup(params.get("focus"), true);
if (params.get("select") && byId.has(params.get("select"))) select(params.get("select"), true); else renderPanel();
if (params.get("view") === "table") setView("table");
hashReady = true;
</script>
</body>
</html>
