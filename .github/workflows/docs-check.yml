# Builds the documentation site on every PR, so a change that breaks it -- such as a survey that deeper_research/graph.py
# cannot draw on the "Survey maps" page -- fails before it merges, not at the next release, which is the only time
# reusable-pipeline.yml builds and deploys the site. The built site is kept as an artifact, to preview it.
#
# This file is this repo's own, not the PyMaxQ template's, so `copier update` leaves it alone.
name: Docs check

on:
  pull_request:

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth 0: hatch-vcs derives the package version from the git tags when uv installs the project.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync
      # Builds every survey's map (poe graphs), then the site. The test report pages are missing here, since no tests
      # ran; mkdocs only warns about them.
      - name: Build the docs site
        run: uv run poe docs
      - name: Upload the site, for preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: public/
          retention-days: 7
